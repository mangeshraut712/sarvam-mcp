name: Build, Push & Deploy

on:
  push:
    branches: [main]
    tags: ["v*-prod", "v*-staging", "v*-qa"]

# Security: only run workflows from the default branch, not from forks or PRs
permissions:
  contents: read

env:
  AZURE_USERNAME: "gitopsdocker"
  AZURE_REGISTRY: "gitopsdocker.azurecr.io"
  HELM_REPO: sarvamai/sarvam-helm-charts
  HELM_VALUES_PATH: azure/platform/saas-prod/sarvam-mcp/values.yaml

jobs:
  build-and-push:
    runs-on: [self-hosted, size-small-public]
    if: |
      github.repository == 'sarvamai/sarvam-mcp' &&
      (github.event_name == 'push') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        run: |
          echo "$AZURE_REGISTRY_PASSWORD" | docker login ${{ env.AZURE_REGISTRY }} \
            -u ${{ env.AZURE_USERNAME }} --password-stdin

      - name: Production Gate Check
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-prod" ]]; then
            echo "Production tag detected. Verifying branch lineage..."
            if git merge-base --is-ancestor ${{ github.sha }} origin/main; then
              echo "Success: Tagged commit exists on the main branch."
            else
              echo "FAILURE: Production tags must match a commit on main."
              exit 1
            fi
          fi

      - name: Determine Tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_NAME="sarvam-mcp"
          AZURE_IMAGE="${{ env.AZURE_REGISTRY }}/$IMAGE_NAME"

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            # Push to main — build with SHA and latest-prod tag
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            TAG_NAME="v${VERSION}-prod"
            TAGS="${AZURE_IMAGE}:${TAG_NAME},${AZURE_IMAGE}:${SHORT_SHA},${AZURE_IMAGE}:latest"
          else
            TAG_NAME="${{ github.ref_name }}"
            if echo "$TAG_NAME" | grep -q '\-prod$'; then
              ENV_TAG="latest"
            elif echo "$TAG_NAME" | grep -q '\-staging$'; then
              ENV_TAG="latest-staging"
            else
              ENV_TAG="latest-qa"
            fi
            TAGS="${AZURE_IMAGE}:${TAG_NAME},${AZURE_IMAGE}:${SHORT_SHA},${AZURE_IMAGE}:${ENV_TAG}"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tools/sarvam-mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.AZURE_REGISTRY }}/sarvam-mcp:buildcache
          cache-to: type=registry,ref=${{ env.AZURE_REGISTRY }}/sarvam-mcp:buildcache,mode=max

  update-helm-values:
    needs: build-and-push
    if: github.ref_name == 'main' || contains(github.ref_name, '-prod')
    runs-on: [self-hosted, size-small-public]
    steps:
      - name: Checkout helm-charts repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          token: ${{ secrets.HELM_CHARTS_PAT }}
          ref: main

      - name: Update image tag in values.yaml
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          sed -i "s|tag: \".*\"|tag: \"${TAG}\"|" "${{ env.HELM_VALUES_PATH }}"
          echo "Updated tag to ${TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.build-and-push.outputs.tag }}"
          git add "${{ env.HELM_VALUES_PATH }}"
          git commit -m "chore(sarvam-mcp): bump image tag to ${TAG}"
          git push
