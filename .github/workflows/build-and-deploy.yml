name: Build, Push & Deploy

on:
  push:
    tags: ["v*-prod"]

env:
  REGISTRY: gitopsdocker.azurecr.io
  IMAGE_NAME: sarvam-mcp
  HELM_REPO: sarvamai/sarvam-helm-charts
  HELM_VALUES_PATH: azure/platform/saas-prod/sarvam-mcp/values.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/sarvam-mcp/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  update-helm-values:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helm-charts repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          token: ${{ secrets.HELM_CHARTS_PAT }}
          ref: main

      - name: Update image tag in values.yaml
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          sed -i "s|tag: \".*\"|tag: \"${TAG}\"|" "${{ env.HELM_VALUES_PATH }}"
          echo "Updated tag to ${TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.build-and-push.outputs.tag }}"
          git add "${{ env.HELM_VALUES_PATH }}"
          git commit -m "chore(sarvam-mcp): bump image tag to ${TAG}"
          git push
