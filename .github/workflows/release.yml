name: Publish to PyPI

# Triggers on a version tag (`v0.1.0`, `v1.2.3`, etc).
# Uses PyPI Trusted Publishing (OIDC) — no API token needed in repo secrets.
# Setup: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#
# Required PyPI side configuration (one-time, by an org admin):
#   PyPI account → Publishing → Add a pending trusted publisher
#     Project name:    sarvam-mcp
#     Owner:           sarvamai
#     Repository:      sarvam-mcp
#     Workflow:        release.yml
#     Environment:     pypi          (matches `environment:` block below)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build

      - name: Show distributions
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment is what PyPI's Trusted Publisher will match against.
    environment:
      name: pypi
      url: https://pypi.org/p/sarvam-mcp
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No `password` / `user` — PyPI Trusted Publishing handles auth.
          packages-dir: dist/
          print-hash: true
