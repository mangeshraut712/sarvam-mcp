{{- $serviceValues := index .Values "sarvam-mcp-website" -}}

{{- range $container := $serviceValues.containers }}
  {{- $commonEnv := $.Values.commonEnv | default list }}
  {{- $containerEnv := $container.env | default list }}
  {{- $mergedEnv := concat $commonEnv $containerEnv }}
  {{- $_ := set $container "env" $mergedEnv }}
{{- end }}

{{ include "modules.deployment" $serviceValues }}
