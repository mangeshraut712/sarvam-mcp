steps:
  - id: acr-login
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker login gitopsdocker.azurecr.io \
          --username=gitopsdocker \
          --password=$$AZURE_GITOPSDOCKER_PASSWORD
    secretEnv:
      - AZURE_GITOPSDOCKER_PASSWORD

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - tools/sarvam-mcp/Dockerfile
      - -t
      - gitopsdocker.azurecr.io/sarvam-mcp:$TAG_NAME
      - -t
      - gitopsdocker.azurecr.io/sarvam-mcp:latest
      - -t
      - gitopsdocker.azurecr.io/sarvam-mcp-website:$TAG_NAME
      - -t
      - gitopsdocker.azurecr.io/sarvam-mcp-website:latest
      - .

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - gitopsdocker.azurecr.io/sarvam-mcp

  - id: docker-push-website
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - gitopsdocker.azurecr.io/sarvam-mcp-website

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "$TAG_NAME" == *-qa ]]; then
          _ENV="qa"
        elif [[ "$TAG_NAME" == *-staging ]]; then
          _ENV="staging"
        elif [[ "$TAG_NAME" == *-prod ]]; then
          _ENV="prod"
        else
          echo "Tag $TAG_NAME does not match deployment pattern. Skipping deploy."
          exit 0
        fi
        
        gcloud run deploy sarvam-mcp-$${_ENV} \
          --image gitopsdocker.azurecr.io/sarvam-mcp:$TAG_NAME \
          --region asia-south1 \
          --project gitops-421705 \
          --platform managed \
          --allow-unauthenticated \
          --port 8000 \
          --set-env-vars="SARVAM_MCP_TRANSPORT=http"

availableSecrets:
  secretManager:
    - versionName: projects/gitops-421705/secrets/azure-gitopsdocker-password/versions/latest
      env: AZURE_GITOPSDOCKER_PASSWORD

options:
  logging: CLOUD_LOGGING_ONLY
