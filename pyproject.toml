[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sarvam-mcp"
version = "0.1.0"
description = "Official Sarvam AI MCP server — STT, TTS, Translate, Transliterate, LLM, Vision OCR for Indic languages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Sarvam AI" }]
keywords = ["sarvam", "mcp", "model-context-protocol", "tts", "stt", "indic", "translation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.6",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
sarvam-mcp = "sarvam_mcp.server:main"

[project.urls]
Homepage = "https://sarvam.ai"
Documentation = "https://docs.sarvam.ai"

[tool.hatch.build.targets.wheel]
packages = ["src/sarvam_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/sarvam_mcp", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# B008: Pydantic Field() in defaults is idiomatic for FastMCP tool signatures.
# A003: tool args use names like `input` / `id` matching the Sarvam API.
ignore = ["B008", "A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
